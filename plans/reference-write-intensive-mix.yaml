name: reference-write-intensive-mix
endpoint: https://eu-central-1.storage.impossibleapi.net
region: eu-central-1
bucket: bench-scratch

defaults:
  duration: 10m
  threads: 64
  warmup: 30s
  multipart_part_size: 16MiB
  multipart_concurrency: 8

workloads:
  - name: write-mix
    type: mix
    params:
      workloads:
        - name: ckpt
          type: checkpointing
          weight: 1
          object_size: 1073741824      # 1 GiB
          params:
            writers: 2
            burst_interval: 2m
            retain_versions: 2
        - name: lance-writes
          type: lancedb
          weight: 1
          params:
            fragments: 50
            fragment_size: 16777216    # 16 MiB
            manifest_count: 25
            read_ratio: 0.0
        - name: small-burst
          type: smallobject
          weight: 1
          object_size: 8192
          params:
            read_ratio: 0.0

output:
  text: ./reports/write-intensive-mix.txt
  json: ./reports/write-intensive-mix.json
  progress: true
