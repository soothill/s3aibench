name: reference-large-object
endpoint: https://eu-central-1.storage.impossibleapi.net
region: eu-central-1
bucket: bench-scratch

defaults:
  duration: 10m
  threads: 32
  warmup: 30s
  multipart_part_size: 16MiB
  multipart_concurrency: 8

workloads:
  - name: largeobj-throughput
    type: largeobject
    object_size: 10GiB
    params:
      read_ratio: 0.0

output:
  text: ./reports/large-object.txt
  json: ./reports/large-object.json
  progress: true
