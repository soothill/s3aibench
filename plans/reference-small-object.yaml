name: reference-small-object
endpoint: https://eu-central-1.storage.impossibleapi.net
region: eu-central-1
bucket: bench-scratch

defaults:
  duration: 5m
  threads: 1024
  warmup: 30s

workloads:
  - name: smallobj-iops
    type: smallobject
    object_size: 4KiB
    params:
      read_ratio: 0.5

output:
  text: ./reports/small-object.txt
  json: ./reports/small-object.json
  progress: true
