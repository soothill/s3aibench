name: perf-50kops
endpoint: https://eu-central-1.storage.impossibleapi.net
region: eu-central-1
bucket: bench-scratch

defaults:
  duration: 5m
  threads: 1024
  warmup: 30s
  connection_pool_size: 16384

workloads:
  - name: iops
    type: smallobject
    object_size: 4KiB
    params:
      read_ratio: 1.0

output:
  text: ./reports/perf-50kops.txt
  json: ./reports/perf-50kops.json
  progress: true
