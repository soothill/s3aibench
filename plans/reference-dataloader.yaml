name: reference-dataloader
endpoint: https://eu-central-1.storage.impossibleapi.net
region: eu-central-1
bucket: bench-scratch

defaults:
  duration: 15m
  threads: 512
  warmup: 30s

workloads:
  - name: dataloader
    type: training_data
    params:
      object_count: 1000000
      size_mean: 524288       # 512 KiB
      size_sigma: 0.8
      size_min: 65536
      size_max: 4194304
      access_pattern: zipfian
      zipfian_s: 1.07
      range_probability: 0.0

output:
  text: ./reports/dataloader.txt
  json: ./reports/dataloader.json
  progress: true
