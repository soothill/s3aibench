name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m
      - name: go vet
        run: go vet ./...
      - name: coverage gate
        run: make coverage
      - name: validate every reference plan
        run: |
          go build -o s3aibench ./cmd/s3aibench
          for p in plans/*.yaml; do
            echo "==> $p"
            ./s3aibench validate --plan "$p"
          done

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true
      - run: make cross
