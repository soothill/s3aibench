name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          GIT_SHA="$(git rev-parse --short HEAD)"
          LDFLAGS="-X github.com/darrensoothill/s3aibench/internal/version.Version=${VERSION} -X github.com/darrensoothill/s3aibench/internal/version.GitSHA=${GIT_SHA}"
          mkdir -p dist
          go build -ldflags "${LDFLAGS}" -o "dist/s3aibench-${GOOS}-${GOARCH}" ./cmd/s3aibench
      - name: Checksum
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: s3aibench-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Consolidate
        run: |
          mkdir -p release
          find artifacts -type f -not -name 'SHA256SUMS' -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
